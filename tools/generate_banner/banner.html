<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delta Media - Social Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1280px;
      height: 640px;
      overflow: hidden;
      background-color: #06070a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Deep space atmosphere with Delta indigo/cyan aura */
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(99, 102, 241, 0.32) 0%, rgba(79, 70, 229, 0.15) 35%, transparent 65%),
        radial-gradient(circle at 20% 80%, rgba(56, 189, 248, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 48px 48px, 48px 48px;
    }

    /* Ambient Outer Frame Border */
    .frame-border {
      position: absolute;
      inset: 20px;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      pointer-events: none;
      box-shadow: 
        inset 0 0 60px rgba(99, 102, 241, 0.08),
        0 0 80px rgba(0, 0, 0, 0.8);
    }

    /* Corner Accent Lights */
    .corner-accent {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid #818cf8;
      pointer-events: none;
    }
    .corner-tl { top: 32px; left: 32px; border-right: none; border-bottom: none; }
    .corner-tr { top: 32px; right: 32px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 32px; left: 32px; border-right: none; border-top: none; }
    .corner-br { bottom: 32px; right: 32px; border-left: none; border-top: none; }

    /* Central Content Container */
    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      text-align: center;
    }

    /* Massive Logo Aura */
    .logo-aura-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .aura-glow {
      position: absolute;
      width: 380px;
      height: 320px;
      background: radial-gradient(circle, rgba(133, 155, 255, 0.5) 0%, rgba(99, 102, 241, 0.25) 45%, transparent 70%);
      filter: blur(45px);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    /* 4X Logo: width was 58px, now 240px (~4.1x larger) */
    .delta-logo-svg {
      width: 240px;
      height: 202px;
      position: relative;
      z-index: 2;
      filter: 
        drop-shadow(0 0 35px rgba(133, 155, 255, 0.75))
        drop-shadow(0 15px 30px rgba(0, 0, 0, 0.7));
    }

    /* Massive High-Impact Title */
    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 6px;
    }

    .main-title {
      font-size: 82px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 20%, #e0e7ff 55%, #a5b4fc 80%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 20px rgba(99, 102, 241, 0.35));
    }

    .main-title .accent {
      background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 50%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Clean, High-Contrast Tag Pill */
    .tag-badge {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(99, 102, 241, 0.16);
      border: 1.5px solid rgba(165, 180, 252, 0.4);
      border-radius: 100px;
      padding: 10px 28px;
      backdrop-filter: blur(16px);
      box-shadow: 
        0 8px 24px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(99, 102, 241, 0.25);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8, 0 0 24px #38bdf8;
    }

    .tag-text {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e0e7ff;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

  <!-- Outer Frame & Cyber Corner Accents -->
  <div class="frame-border"></div>
  <div class="corner-accent corner-tl"></div>
  <div class="corner-accent corner-tr"></div>
  <div class="corner-accent corner-bl"></div>
  <div class="corner-accent corner-br"></div>

  <!-- Hero Content Centered -->
  <div class="hero-container">
    
    <!-- 4x Larger Delta Logo with Neon Aura -->
    <div class="logo-aura-wrapper">
      <div class="aura-glow"></div>
      <svg class="delta-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 27" fill="none">
        <defs>
          <radialGradient id="deltaGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(16 13.5) scale(16 13)">
            <stop stop-color="#c7d2fe"/>
            <stop offset="0.4" stop-color="#859bff"/>
            <stop offset="1" stop-color="#4f46e5"/>
          </radialGradient>
        </defs>
        <path fill="url(#deltaGrad)" fill-rule="evenodd" d="M14.89 26.3H19.33C24.09 26.08 29.89 22.95 31.54 16.67C31.84 15.54 32 14.31 32 12.98C32 12.84 32 12.7 31.99 12.57C31.83 8.7 29.37 4.92 26.27 2.67C24.46 1.37 22.43 0.57 20.51 0.57H0L14.89 26.3ZM13.71 17.03L18.94 7.89H14.76L11.62 13.24L6.14 4.1H19.72C22.8 4.1 27.37 6.88 28.21 11.67C28.3 12.17 28.34 12.7 28.34 13.24C28.34 17.94 24.29 22.64 19.72 22.64H16.85L13.71 17.03Z"/>
        <path fill="url(#deltaGrad)" d="M4.18 26.43H8.36L9.53 24.21L7.31 20.69L4.18 26.43Z"/>
      </svg>
    </div>

    <!-- Massive High-Contrast Title -->
    <div class="title-row">
      <h1 class="main-title">DELTA <span class="accent">MEDIA</span></h1>
    </div>

    <!-- Clean, High-Visibility Badge -->
    <div class="tag-badge">
      <div class="status-dot"></div>
      <span class="tag-text">OFFICIAL PORTAL</span>
    </div>

  </div>

</body>
</html>
